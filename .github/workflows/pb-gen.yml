name: Generate Protobuffers

on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        default: main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
env:
  GO_CACHE_VER: v1
defaults:
  run:
    working-directory: greeting
jobs:
  gen-pb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 #v5.0.3
        with:
          id: cache
          path: ~/go/bin
          key: ${{env.GO_CACHE_VER}}-${{ runner.os }}-${{ hashFiles('greeting/go.sum') }}
          restore-keys: |
            ${{env.GO_CACHE_VER}}-${{ runner.os }}
      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 #v6.0.0
        with:
          go-version-file: "greeting/go.mod"
      - name: go mod tidy
        run: go mod tidy
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b #v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install protoc plugins
        if: ${{ steps.cache.outputs.cache-hit == false }}
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: Generate Protobuffers
        run: make gen/pb
      - uses: dev-hato/actions-diff-pr-management@b446497d139ed3eadc62ec1dd90dd27960ad1a0c #v2.2.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
